{% extends "web/base.html" %}
{% block title %}Delete entry — Virtual Diary{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h5">Move "{{ entry.title|default:"this entry" }}" to trash?</h1>
        <p class="text-muted">You can restore it later from the Trash page.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Move to Trash</button>
          <a href="{% url 'web:diary-detail' entry.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
