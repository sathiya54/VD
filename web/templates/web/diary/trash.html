{% extends "web/base.html" %}
{% block title %}Trash — Virtual Diary{% endblock %}
{% block content %}
<h1 class="h3 mb-3">🗑️ Trash</h1>
<table class="table">
  <thead><tr><th>Title</th><th>Date</th><th></th></tr></thead>
  <tbody>
    {% for entry in entries %}
    <tr>
      <td>{{ entry.title|default:"Untitled" }}</td>
      <td>{{ entry.date }}</td>
      <td class="text-end">
        <form method="post" action="{% url 'web:trash-restore' entry.pk %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-success">Restore</button>
        </form>
        <form method="post" action="{% url 'web:trash-delete' entry.pk %}" class="d-inline" onsubmit="return confirm('Permanently delete this entry? This cannot be undone.')">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-danger">Delete forever</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3" class="text-muted">Trash is empty.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
