{% extends "web/base.html" %}
{% block title %}Profile — Virtual Diary{% endblock %}
{% block content %}
<h1 class="h3 mb-3">👤 Profile & Settings</h1>

<div class="row">
  <div class="col-md-6">
    <div class="card mb-3">
      <div class="card-body">
        <h2 class="h6">Account</h2>
        <p class="mb-1"><strong>Username:</strong> {{ user.username }}</p>
        <p class="mb-1"><strong>Email:</strong> {{ user.email }}</p>
        <p class="mb-0"><strong>Joined:</strong> {{ user.date_joined|date }}</p>
      </div>
    </div>

    <form method="post" class="card">
      {% csrf_token %}
      <div class="card-body">
        <h2 class="h6">Preferences</h2>
        <div class="mb-3">
          <label class="form-label">Bio</label>
          <textarea name="bio" class="form-control" rows="2">{{ profile.bio }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Appearance</label>
          <select name="dark_mode_pref" class="form-select">
            <option value="light" {% if profile.dark_mode_pref == 'light' %}selected{% endif %}>Light</option>
            <option value="dark" {% if profile.dark_mode_pref == 'dark' %}selected{% endif %}>Dark</option>
            <option value="system" {% if profile.dark_mode_pref == 'system' %}selected{% endif %}>System</option>
          </select>
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" name="ai_enabled" class="form-check-input" id="ai_enabled" {% if profile.ai_enabled %}checked{% endif %}>
          <label class="form-check-label" for="ai_enabled">Enable AI Assistant (title/summary/tags/writing help)</label>
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
